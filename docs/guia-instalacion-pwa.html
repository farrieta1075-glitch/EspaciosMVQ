<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>MVQro Espacios — Instalar la app</title>
    <style>
      @page {
        size: A4 portrait;
        margin: 0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #2c241c;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .page {
        width: 210mm;
        height: 297mm;
        padding: 10mm 12mm 8mm;
        page-break-after: always;
        display: flex;
        flex-direction: column;
        background: #faf8f5;
        overflow: hidden;
      }
      .page:last-child {
        page-break-after: auto;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6mm;
        margin-bottom: 5mm;
        padding-bottom: 4mm;
        border-bottom: 3px solid #6b5a4d;
      }
      header h1 {
        margin: 0;
        font-size: 20pt;
        font-weight: 800;
        color: #6b5a4d;
        line-height: 1.1;
      }
      header .platform {
        text-align: right;
        font-size: 11pt;
        font-weight: 700;
        color: #4a3f36;
        line-height: 1.35;
      }
      .steps {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 3mm;
        align-items: stretch;
        min-height: 0;
      }
      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #fff;
        border-radius: 10px;
        border: 1px solid #e0d6cb;
        padding: 2.5mm 2mm 2mm;
        box-shadow: 0 2px 8px rgba(44, 36, 28, 0.06);
      }
      .step-num {
        width: 9mm;
        height: 9mm;
        border-radius: 50%;
        background: #6b5a4d;
        color: #faf8f5;
        font-size: 13pt;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-bottom: 1.5mm;
      }
      .step svg {
        width: 100%;
        height: auto;
        max-height: 58mm;
        flex: 1;
      }
      footer {
        margin-top: 4mm;
        font-size: 8.5pt;
        color: #7a6b5c;
        text-align: center;
        line-height: 1.35;
      }
      footer strong {
        color: #6b5a4d;
      }
    </style>
  </head>
  <body>
    <!-- Hoja 1: iOS -->
    <section class="page">
      <header>
        <h1>Instalar MVQro Espacios</h1>
        <div class="platform">
          iPhone · iOS<br />
          <span style="font-weight: 600; font-size: 9.5pt">Safari</span>
        </div>
      </header>
      <div class="steps">
        <article class="step">
          <div class="step-num">1</div>
          <svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="112" height="192" rx="14" fill="#1c1c1e" />
            <rect x="10" y="18" width="100" height="170" rx="10" fill="#fff" />
            <rect x="18" y="28" width="84" height="14" rx="4" fill="#e8e8ed" />
            <text x="60" y="38" text-anchor="middle" font-size="6" fill="#666" font-family="Segoe UI,sans-serif">MVQro Espacios</text>
            <text x="60" y="95" text-anchor="middle" font-size="9" fill="#6b5a4d" font-weight="700" font-family="Segoe UI,sans-serif">Abre Safari</text>
            <text x="60" y="108" text-anchor="middle" font-size="6.5" fill="#444" font-family="Segoe UI,sans-serif">y entra al enlace</text>
          </svg>
        </article>
        <article class="step">
          <div class="step-num">2</div>
          <svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="112" height="192" rx="14" fill="#1c1c1e" />
            <rect x="10" y="18" width="100" height="170" rx="10" fill="#fff" />
            <rect x="18" y="150" width="84" height="28" rx="8" fill="#f2f2f7" />
            <rect x="72" y="156" width="22" height="16" rx="4" fill="#007aff" stroke="#ff3b30" stroke-width="2" />
            <text x="60" y="88" text-anchor="middle" font-size="8" fill="#007aff" font-weight="700" font-family="Segoe UI,sans-serif">Compartir</text>
            <text x="60" y="102" text-anchor="middle" font-size="6" fill="#666" font-family="Segoe UI,sans-serif">↑ abajo en Safari</text>
          </svg>
        </article>
        <article class="step">
          <div class="step-num">3</div>
          <svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="112" height="192" rx="14" fill="#1c1c1e" />
            <rect x="10" y="40" width="100" height="140" rx="10" fill="#f2f2f7" />
            <rect x="18" y="95" width="84" height="22" rx="6" fill="#fff" stroke="#007aff" stroke-width="2" />
            <rect x="24" y="100" width="12" height="12" rx="3" fill="#6b5a4d" />
            <text x="52" y="110" font-size="7" fill="#000" font-weight="600" font-family="Segoe UI,sans-serif">Añadir a inicio</text>
            <text x="60" y="78" text-anchor="middle" font-size="7" fill="#007aff" font-weight="700" font-family="Segoe UI,sans-serif">Añadir a inicio</text>
          </svg>
        </article>
        <article class="step">
          <div class="step-num">4</div>
          <svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="112" height="192" rx="14" fill="#1c1c1e" />
            <rect x="10" y="18" width="100" height="170" rx="10" fill="#fff" />
            <text x="88" y="32" font-size="8" fill="#007aff" font-weight="700" font-family="Segoe UI,sans-serif">Añadir</text>
            <rect x="22" y="70" width="36" height="36" rx="8" fill="#6b5a4d" />
            <text x="60" y="130" text-anchor="middle" font-size="8" fill="#007aff" font-weight="700" font-family="Segoe UI,sans-serif">Añadir</text>
          </svg>
        </article>
        <article class="step">
          <div class="step-num">5</div>
          <svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="112" height="192" rx="14" fill="#1c1c1e" />
            <rect x="10" y="18" width="100" height="170" rx="10" fill="#364fc7" />
            <rect x="44" y="55" width="32" height="32" rx="8" fill="#6b5a4d" stroke="#fff" stroke-width="2" />
            <text x="60" y="110" text-anchor="middle" font-size="7" fill="#fff" font-family="Segoe UI,sans-serif">Icono en</text>
            <text x="60" y="122" text-anchor="middle" font-size="7" fill="#fff" font-weight="700" font-family="Segoe UI,sans-serif">pantalla de inicio</text>
          </svg>
        </article>
      </div>
      <footer>
        <strong>iPhone:</strong> usa Safari (no Chrome). Para notificaciones, abre siempre desde el icono, no desde Safari.
      </footer>
    </section>

    <!-- Hoja 2: Android -->
    <section class="page">
      <header>
        <h1>Instalar MVQro Espacios</h1>
        <div class="platform">
          Android<br />
          <span style="font-weight: 600; font-size: 9.5pt">Chrome</span>
        </div>
      </header>
      <div class="steps">
        <article class="step">
          <div class="step-num">1</div>
          <svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="112" height="192" rx="12" fill="#1a1a1a" />
            <rect x="10" y="16" width="100" height="172" rx="9" fill="#fff" />
            <rect x="18" y="24" width="70" height="12" rx="4" fill="#e8eaed" />
            <text x="60" y="95" text-anchor="middle" font-size="9" fill="#6b5a4d" font-weight="700" font-family="Segoe UI,sans-serif">Chrome</text>
            <text x="60" y="108" text-anchor="middle" font-size="6.5" fill="#444" font-family="Segoe UI,sans-serif">enlace MVQro</text>
          </svg>
        </article>
        <article class="step">
          <div class="step-num">2</div>
          <svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="112" height="192" rx="12" fill="#1a1a1a" />
            <rect x="10" y="16" width="100" height="172" rx="9" fill="#fff" />
            <rect x="82" y="22" width="22" height="22" rx="11" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2" />
            <circle cx="88" cy="33" r="1.5" fill="#1a73e8" />
            <circle cx="94" cy="33" r="1.5" fill="#1a73e8" />
            <circle cx="100" cy="33" r="1.5" fill="#1a73e8" />
            <text x="60" y="95" text-anchor="middle" font-size="14" fill="#1a73e8" font-weight="700" font-family="Segoe UI,sans-serif">⋮</text>
            <text x="60" y="110" text-anchor="middle" font-size="6" fill="#666" font-family="Segoe UI,sans-serif">Menú arriba</text>
          </svg>
        </article>
        <article class="step">
          <div class="step-num">3</div>
          <svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="112" height="192" rx="12" fill="#1a1a1a" />
            <rect x="28" y="35" width="64" height="100" rx="8" fill="#fff" stroke="#dadce0" />
            <rect x="34" y="78" width="52" height="18" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2" />
            <text x="60" y="90" text-anchor="middle" font-size="5.5" fill="#1a73e8" font-weight="700" font-family="Segoe UI,sans-serif">Instalar app</text>
            <text x="60" y="155" text-anchor="middle" font-size="5.5" fill="#888" font-family="Segoe UI,sans-serif">o «Añadir a inicio»</text>
          </svg>
        </article>
        <article class="step">
          <div class="step-num">4</div>
          <svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="112" height="192" rx="12" fill="#1a1a1a" />
            <rect x="18" y="70" width="84" height="55" rx="8" fill="#fff" stroke="#dadce0" />
            <text x="60" y="88" text-anchor="middle" font-size="7" font-weight="700" font-family="Segoe UI,sans-serif">¿Instalar?</text>
            <rect x="62" y="98" width="32" height="16" rx="8" fill="#1a73e8" />
            <text x="78" y="109" text-anchor="middle" fill="#fff" font-size="6" font-weight="700" font-family="Segoe UI,sans-serif">Instalar</text>
            <text x="60" y="145" text-anchor="middle" font-size="8" fill="#1a73e8" font-weight="700" font-family="Segoe UI,sans-serif">Instalar</text>
          </svg>
        </article>
        <article class="step">
          <div class="step-num">5</div>
          <svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="112" height="192" rx="12" fill="#1a1a1a" />
            <rect x="10" y="16" width="100" height="172" rx="9" fill="#202124" />
            <rect x="38" y="55" width="36" height="36" rx="8" fill="#6b5a4d" stroke="#8ab4f8" stroke-width="2" />
            <text x="60" y="115" text-anchor="middle" font-size="7" fill="#e8eaed" font-family="Segoe UI,sans-serif">Abre desde</text>
            <text x="60" y="127" text-anchor="middle" font-size="7" fill="#fff" font-weight="700" font-family="Segoe UI,sans-serif">icono / cajón</text>
          </svg>
        </article>
      </div>
      <footer>
        <strong>Android:</strong> activa notificaciones dentro de la app. Inicia sesión con tu usuario.
      </footer>
    </section>
  </body>
</html>
